<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>VolleyForge — Blobby Volley Reimplementation</title>
    <link data-trunk rel="rust" data-bin="volleyforge" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #loading {
            position: absolute;
            color: #f1c40f;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }
    </style>
</head>
<body>
    <div id="loading">🏐 Lade VolleyForge...</div>
    <canvas id="volleyforge_canvas"></canvas>
    <script>
        // Entferne den Lade-Hinweis, sobald der Canvas gezeichnet wird
        const observer = new MutationObserver(() => {
            const canvas = document.getElementById('volleyforge_canvas');
            if (canvas && canvas.width > 0) {
                const loading = document.getElementById('loading');
                if (loading) loading.style.opacity = '0';
            }
        });
        window.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('volleyforge_canvas');
            if (canvas) observer.observe(canvas, { attributes: true });
        });
    </script>
</body>
</html>
