[package]
name = "volleyforge"
version = "1.0.0"
edition = "2024"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "wav", "pcm"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "ansi", "env-filter", "chrono"] }
web-time = "1.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Storage",
    "HtmlInputElement",
    "FileReader",
    "File",
    "FileList",
    "Event",
    "Blob",
] }
log = "0.4"

[target.wasm32-unknown-unknown.dependencies]
zip = { version = "9.1.0", default-features = false, features = ["deflate"] }
