name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # Windows: Erstellt volleyforge.exe & ZIP-Paket
  # =========================================================================
  build-windows:
    name: Windows x86_64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Assets
        shell: pwsh
        run: |
          if (!(Test-Path "graph.pak")) {
            Write-Host "Assets nicht gefunden. Lade Original-Assets von archive.org..."
            Invoke-WebRequest -Uri "https://archive.org/download/blobbyvolley_202102/blobby.zip" -OutFile "blobby.zip"
            Expand-Archive -Path "blobby.zip" -DestinationPath "blobby_extracted" -Force
            Get-ChildItem -Path "blobby_extracted" -Recurse -Filter "*.pak" | Copy-Item -Destination "."
            Remove-Item -Recurse -Force "blobby_extracted", "blobby.zip"
          }
          Get-ChildItem *.pak

      - name: Build Release
        run: cargo build --release

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist-win"
          Copy-Item "target/release/volleyforge.exe" "dist-win/"
          # The game reads its containers from the folder of the executable.
          Copy-Item "*.pak" "dist-win/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist-win/" }
          Compress-Archive -Path "dist-win/*" -DestinationPath "volleyforge-windows-x86_64.zip" -Force

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: volleyforge-windows-x86_64
          path: |
            target/release/volleyforge.exe
            target/release/*.pak
            volleyforge-windows-x86_64.zip

  # =========================================================================
  # Linux: Erstellt vollwertiges Linux AppImage
  # =========================================================================
  build-linux:
    name: Linux x86_64 (AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libxkbcommon-dev \
            pkg-config \
            wget \
            file \
            librsvg2-bin

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Ensure Assets
        run: |
          if [ ! -f "graph.pak" ]; then
            echo "Assets nicht gefunden. Lade Original-Assets von archive.org..."
            curl -fsSL -o /tmp/blobby.zip https://archive.org/download/blobbyvolley_202102/blobby.zip
            unzip -q /tmp/blobby.zip -d /tmp/blobby_extracted
            find /tmp/blobby_extracted -type f -iname "*.pak" -exec cp {} . \;
            rm -rf /tmp/blobby.zip /tmp/blobby_extracted
          fi
          ls -la *.pak

      - name: Build Release
        run: cargo build --release

      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Binary kopieren
          cp target/release/volleyforge AppDir/usr/bin/

          # Die Container des Originals gehoeren neben das Binary - das Spiel
          # liest sie aus dem Ordner der Datei.
          cp *.pak AppDir/usr/bin/

          # Desktop-Entry erstellen
          cat << 'EOF' > AppDir/volleyforge.desktop
[Desktop Entry]
Type=Application
Name=VolleyForge
Comment=Authentic 1:1 Blobby Volley Reimplementation
Exec=volleyforge
Icon=volleyforge
Categories=Game;ArcadeGame;
Terminal=false
EOF
          cp AppDir/volleyforge.desktop AppDir/usr/share/applications/volleyforge.desktop

          # Icon erstellen (Volleyball-Vektorgrafik -> PNG 256x256)
          cat << 'EOF' > AppDir/volleyforge.svg
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="grad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff7b54"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </radialGradient>
  </defs>
  <circle cx="128" cy="128" r="116" fill="url(#grad)" stroke="#2c3e50" stroke-width="12"/>
  <path d="M 50 45 Q 128 128 206 211" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <path d="M 206 45 Q 128 128 50 211" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <circle cx="128" cy="128" r="24" fill="#f1c40f" stroke="#2c3e50" stroke-width="6"/>
</svg>
EOF
          rsvg-convert -w 256 -h 256 AppDir/volleyforge.svg -o AppDir/volleyforge.png
          cp AppDir/volleyforge.png AppDir/usr/share/icons/hicolor/256x256/apps/volleyforge.png

          # AppRun Startskript
          cat << 'EOF' > AppDir/AppRun
#!/bin/sh
HERE="$(dirname "$(readlink -f "${0}")")"
export PATH="${HERE}/usr/bin:${PATH}"
export LD_LIBRARY_PATH="${HERE}/usr/lib:${LD_LIBRARY_PATH}"
cd "${HERE}"
exec "${HERE}/usr/bin/volleyforge" "$@"
EOF
          chmod +x AppDir/AppRun

          # appimagetool herunterladen und AppImage erzeugen
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool --appimage-extract
          ARCH=x86_64 ./squashfs-root/AppRun AppDir VolleyForge-x86_64.AppImage
          chmod +x VolleyForge-x86_64.AppImage

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VolleyForge-Linux-x86_64
          path: VolleyForge-x86_64.AppImage

  # =========================================================================
  # Web: Erstellt WebAssembly Build mit Trunk
  # =========================================================================
  build-web:
    name: WebAssembly (Wasm / Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust & Wasm Target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Trunk
        run: |
          wget -qO- https://github.com/trunk-rs/trunk/releases/download/v0.21.8/trunk-x86_64-unknown-linux-gnu.tar.gz | sudo tar -xzf- -C /usr/local/bin
          sudo chmod +x /usr/local/bin/trunk

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Web with Trunk
        run: trunk build --release --public-url "./"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: volleyforge-web
          path: dist/

      - name: Prepare Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # =========================================================================
  # GitHub Pages: Automatisches Hosting der Webversion bei Push auf main
  # =========================================================================
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [build-web]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =========================================================================
  # Optional: Automatische GitHub Release bei git-Tags (z. B. v0.1.0)
  # =========================================================================
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: volleyforge-windows-x86_64
          path: release-assets/windows

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: VolleyForge-Linux-x86_64
          path: release-assets/linux

      - name: Download Web Artifact
        uses: actions/download-artifact@v4
        with:
          name: volleyforge-web
          path: release-assets/web

      - name: Package Web Zip
        run: |
          cd release-assets/web
          zip -r ../volleyforge-web.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/windows/volleyforge.exe
            release-assets/windows/volleyforge-windows-x86_64.zip
            release-assets/linux/VolleyForge-x86_64.AppImage
            release-assets/volleyforge-web.zip
          draft: false
          prerelease: false
          generate_release_notes: true
